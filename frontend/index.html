<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO & Trust Verification -->
    <title>Niramoy — Healthcare Made Simple | Rajshahi Doctor & Pharmacy Directory</title>
    <meta name="description" content="Find trusted doctors, discover pharmacies, and manage your healthcare journey with Niramoy — Rajshahi's modern digital healthcare platform. 370+ verified healthcare professionals." />
    <meta name="keywords" content="Niramoy, Rajshahi doctors, doctor directory Bangladesh, pharmacy Rajshahi, healthcare platform, find doctor Rajshahi, hospital directory" />
    <meta name="author" content="Niramoy Digital Healthcare" />
    <meta name="publisher" content="Niramoy Healthcare Platform" />
    <meta name="copyright" content="Niramoy Healthcare" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#042621" />

    <!-- Canonical URL matching live Vercel domain -->
    <link rel="canonical" href="https://niramoy-health.vercel.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Niramoy — Healthcare Made Simple" />
    <meta property="og:description" content="Find trusted doctors, pharmacies, and healthcare services in Rajshahi. 370+ verified healthcare professionals." />
    <meta property="og:url" content="https://niramoy-health.vercel.app" />
    <meta property="og:site_name" content="Niramoy Digital Health" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Niramoy — Healthcare Made Simple" />
    <meta name="twitter:description" content="Find trusted doctors, pharmacies, and healthcare services in Rajshahi." />

    <!-- Favicon (Physical file in public/ directory) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Schema.org Medical Organization Structured Data (Establishes site credibility) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "Niramoy Healthcare",
      "alternateName": "Niramoy Digital Health",
      "url": "https://niramoy-health.vercel.app",
      "logo": "https://niramoy-health.vercel.app/favicon.svg",
      "description": "Verified physician directory, doctor appointment scheduling, pharmacy directory, and emergency healthcare network in Rajshahi, Bangladesh.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Rajshahi",
        "addressRegion": "Rajshahi Division",
        "addressCountry": "BD"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Emergency & Patient Care",
        "telephone": "+8801700000000",
        "availableLanguage": ["Bengali", "English"]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
